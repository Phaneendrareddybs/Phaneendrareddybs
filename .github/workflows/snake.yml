# Save this file at:  .github/workflows/snake.yml
# inside the Phaneendrareddybs/Phaneendrareddybs repo.
#
# It generates the animated "contribution snake" SVG every 12 hours
# (and on every push to main) and pushes the result to the `output` branch,
# which is what the README's snake image URL points at.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  push:
    branches:
      - main
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Phaneendrareddybs
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
